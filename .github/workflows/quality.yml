name: Quality checks

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          
      - name: Install dependencies
        run: flake8 .

      - name: Run PyTest
        env: 
          PYTHONPATH: .
        run: pytest -v